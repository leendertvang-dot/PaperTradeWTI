name: Deploy public dashboard with Hormuz market snapshots
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub schedules are best effort; a run may start late.
    - cron: '*/10 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate published source
        run: |
          python tests/security_checks.py
          python -m unittest discover -s tests -p "test_*.py"
      - name: Fetch public Polymarket market data (no credentials)
        run: python scripts/fetch_hormuz_snapshot.py
      - name: Stage only the public website files and snapshot
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - id: deployment
        uses: actions/deploy-pages@v4
